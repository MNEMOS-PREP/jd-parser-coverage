[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-m02"
version = "0.1.0"
description = "AI Interviewer — M02 JD Parser & Coverage Planner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
    # FR-2.1. Not optional: the spec requires PDF and DOCX alongside pasted
    # text, and a placement-cell email arrives as an attachment at least as
    # often as it arrives as a body a student can select.
    "pymupdf>=1.24",          # the text layer of a PDF
    "python-docx>=1.1",       # .docx paragraphs and tables
    "python-multipart>=0.0.9",  # what FastAPI needs to read an upload at all
    "ai-core @ git+https://github.com/MNEMOS-PREP/Platform_Core@v0.11.0#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["Backend"]
include = ["backend_*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["Backend"]
testpaths = ["Backend/backend_M02_JD_Parser"]
markers = [
    "gate: release-blocking acceptance gate (spec §13)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["BLE001", "E501"] # Ignore blind exceptions and line length limits
[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]
